name: Generate grid (roundup) pins

on:
  workflow_dispatch:          # run manually anytime from GitHub UI
  schedule:
    - cron: "0 8 * * 2,5"    # Tuesday & Friday 8am UTC — separate cadence while this format is new

jobs:
  generate-grid:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: 'pip'
          cache-dependency-path: '**/requirements.txt'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
          pip install -r requirements.txt

      - name: Generate grid pins
        env:
          GEMINI_API_KEY:        ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:          ${{ secrets.SUPABASE_KEY }}
          AMAZON_ASSOCIATE_TAG:  ${{ secrets.AMAZON_ASSOCIATE_TAG }}
          AMAZON_STOREFRONT_URL: ${{ secrets.AMAZON_STOREFRONT_URL }}
        run: python scripts/generate_grid_pins.py