name: Refresh product prices

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview changes only (true or false)'
        required: false
        default: 'true'
      limit:
        description: 'Maximum active products to refresh; 0 means all'
        required: false
        default: '0'
  schedule:
    - cron: "30 5 * * 3"

jobs:
  refresh-prices:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify price parser
        run: python -m unittest tests/test_refresh_prices.py

      - name: Refresh stored prices
        env:
          PRICE_REFRESH_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
          PRICE_REFRESH_LIMIT: ${{ github.event.inputs.limit || '0' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/refresh_prices.py
