name: Repin winners (fresh variations)

on:
  workflow_dispatch:          # manual trigger for testing
  schedule:
    - cron: "0 9 * * 3"     # Every Wednesday at 10 AM UK

jobs:
  repin:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: 'pip'
          cache-dependency-path: '**/requirements.txt'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
          pip install -r requirements.txt

      - name: Repin opportunity-gap products
        env:
          GEMINI_API_KEY:           ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL:             ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:             ${{ secrets.SUPABASE_KEY }}
          PEXELS_API_KEY:           ${{ secrets.PEXELS_API_KEY }}
        run: python scripts/repin_winners.py
